spring:
  application:
    name: hearth

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hearth}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:hearth}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 首次接入时库里已有表（手工建过），用 baseline 跳过"非空库"报错
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  shutdown: graceful

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    cn.firedance.hearth: DEBUG
    # SQL 日志在 prod 必须关掉（含手机号）
    org.mybatis: INFO

app:
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-days: 7
